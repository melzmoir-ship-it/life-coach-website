<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Your Name Life Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-zinc-50 font-sans">
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5">
      <div class="flex justify-between items-center">
        <a href="index.html" class="text-3xl font-bold text-emerald-700">YourName</a>
        <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
          <a href="index.html" class="nav-link text-zinc-700">Home</a>
          <a href="about.html" class="nav-link text-zinc-700">About</a>
          <a href="services.html" class="nav-link text-zinc-700">Services</a>
          <a href="testimonials.html" class="nav-link text-zinc-700">Stories</a>
          <a href="join.html" class="nav-link text-zinc-700">For Coaches</a>
          <a href="contact.html" class="nav-link text-emerald-600 font-semibold">Contact</a>
        </div>
        <button id="mobile-menu-toggle" aria-label="Open menu" class="md:hidden w-10 h-10 flex flex-col items-center justify-center gap-1.5">
          <span class="hamburger-line w-6 h-0.5 bg-zinc-700 block"></span>
          <span class="hamburger-line w-6 h-0.5 bg-zinc-700 block"></span>
          <span class="hamburger-line w-6 h-0.5 bg-zinc-700 block"></span>
        </button>
      </div>
      <div id="mobile-menu" class="mobile-menu md:hidden">
        <div class="flex flex-col gap-1 pt-4 border-t border-zinc-100 mt-4">
          <a href="index.html" class="px-3 py-2.5">Home</a>
          <a href="about.html" class="px-3 py-2.5">About</a>
          <a href="services.html" class="px-3 py-2.5">Services</a>
          <a href="testimonials.html" class="px-3 py-2.5">Stories</a>
          <a href="join.html" class="px-3 py-2.5">For Coaches</a>
          <a href="contact.html" class="px-3 py-2.5 text-emerald-600 font-semibold">Contact</a>
        </div>
      </div>
    </div>
  </nav>
  <section class="bg-emerald-700 text-white py-20 text-center">
    <div class="max-w-4xl mx-auto px-6">
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Get in Touch</h1>
      <p class="text-xl text-emerald-100">Book your free discovery call or send a message.</p>
    </div>
  </section>
  <section class="py-20">
    <div class="max-w-xl mx-auto px-6">
      <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="bg-white rounded-3xl p-8 shadow-sm space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium mb-2">Full Name *</label>
          <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium mb-2">Email *</label>
          <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label for="preferred-date" class="block text-sm font-medium mb-2">Preferred Date</label>
          <input type="date" id="preferred-date" name="preferred_date" class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label for="message" class="block text-sm font-medium mb-2">Message *</label>
          <textarea id="message" name="message" rows="4" required class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
        </div>
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-full font-semibold">Send Message</button>
      </form>
    </div>
  </section>
  <footer class="bg-zinc-800 text-zinc-300 py-8 text-center text-sm">&copy; 2026 Your Name</footer>
  <script src="js/script.js"></script>
</body>
</html>
